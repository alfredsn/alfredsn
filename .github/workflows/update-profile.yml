# Rebuilds everything README.md shows (see .github/scripts/cards.mjs):
#   assets/{header,city,coding}-{light,dark}.svg   cards
#   assets/buttons/*.svg                           call-to-action buttons
#   dist/snake-{light,dark}.svg                    the snake, in the profile's colors
#   README.md                                      the WakaTime block, shown only while connected
# The canvas is redrawn by interact.yml whenever someone paints, not here.
#
# All of it is committed and served from raw.githubusercontent.com, so the README never
# depends on a third-party renderer being up.

name: Update Profile README

on:
  schedule:
    # 22:17 UTC (05:17 WIB). Off-hour slots are less contended than :00.
    - cron: '17 22 * * *'
  push:
    branches: [main]
    # Only re-run when the build itself changes; asset commits must not retrigger.
    paths:
      - '.github/scripts/cards.mjs'
      - '.github/scripts/lib/**'
      - '.github/workflows/update-profile.yml'
  workflow_dispatch:

concurrency:
  group: update-profile
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fails the job instead of writing a placeholder, so an API outage leaves
      # the previous cards in place.
      - name: Generate cards
        env:
          # Swap in a PAT as secrets.METRICS_TOKEN to include private contributions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          # Optional "This week in code" card. Set the repo variable WAKATIME_USER to your WakaTime
          # username and make your languages and coding activity public in WakaTime settings.
          # (Plugin API keys can't read stats; a WAKATIME_TOKEN OAuth secret is the private alternative.)
          WAKATIME_USER: ${{ vars.WAKATIME_USER }}
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: node .github/scripts/cards.mjs

      # Same colors as the cards: the empty cell, then the accent at the four activity
      # levels laid over GitHub's page background (LEVELS in lib/theme.mjs).
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#1D1D1F&color_dots=#F2F2F7,#FCC7B7,#F99F83,#F67750,#F4511E
            dist/snake-dark.svg?palette=github-dark&color_snake=#F5F5F7&color_dots=#21262D,#5A2F25,#924530,#CA5B39,#FF7043

      - name: Commit refreshed cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets dist README.md
          if git diff --cached --quiet; then
            echo "Cards unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile cards [skip ci]"
          # A visitor's issue may have pushed in the meantime. It only touches data/, the
          # canvas, and the guestbook block of README.md, so the rebase applies cleanly.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
