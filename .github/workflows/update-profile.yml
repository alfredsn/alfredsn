# Regenerates the two self-hosted assets used by README.md:
#   assets/header-{light,dark}.svg  — metrics card, built from the GraphQL API
#   dist/snake-{light,dark}.svg     — contribution graph animation
#
# Both are committed to the repo and served from raw.githubusercontent.com, so the
# README never depends on a third-party renderer being up.

name: Update Profile README

on:
  schedule:
    # 22:17 UTC — deliberately off the hour; GitHub drops scheduled runs that
    # pile up at :00, which is why the previous '0 0 * * *' rarely fired.
    - cron: '17 22 * * *'
  push:
    branches: [main]
    # Only re-run when the generator itself changes; asset commits must not retrigger.
    paths:
      - '.github/scripts/**'
      - '.github/workflows/update-profile.yml'
  workflow_dispatch:

concurrency:
  group: update-profile
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fails the job rather than emitting a placeholder, so a stale-but-true
      # card survives an API outage instead of being overwritten with junk.
      - name: Generate header card
        env:
          # Swap in a PAT as secrets.METRICS_TOKEN to include private contributions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: node .github/scripts/generate-header.mjs

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Commit refreshed assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets dist
          if git diff --cached --quiet; then
            echo "Assets unchanged — nothing to commit."
          else
            git commit -m "chore: refresh profile assets [skip ci]"
            git push
          fi
