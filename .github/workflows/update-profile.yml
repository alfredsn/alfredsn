# Rebuilds the cards README.md points at:
#   assets/header-{light,dark}.svg   identity, live status, stats
#   assets/year-{light,dark}.svg     animated contribution calendar
#
# Both are committed to the repo and served from raw.githubusercontent.com, so the
# README never depends on a third-party renderer being up.

name: Update Profile README

on:
  schedule:
    # 22:17 UTC (05:17 WIB). Off-hour slots are less contended than :00, so runs
    # tend to start closer to their scheduled time.
    - cron: '17 22 * * *'
  push:
    branches: [main]
    # Only re-run when the generator itself changes; asset commits must not retrigger.
    paths:
      - '.github/scripts/generate-header.mjs'
      - '.github/workflows/update-profile.yml'
  workflow_dispatch:

concurrency:
  group: update-profile
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fails the job instead of writing a placeholder, so an API outage leaves
      # the previous cards in place.
      - name: Generate cards
        env:
          # Swap in a PAT as secrets.METRICS_TOKEN to include private contributions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: node .github/scripts/generate-header.mjs

      - name: Commit refreshed cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Cards unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile cards [skip ci]"
          # A guestbook signature may have pushed in the meantime; it only touches README.md and data/.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
