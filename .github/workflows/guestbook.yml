# A visitor opens an issue titled "guestbook..." from the link in README.md.
# This adds their avatar to the wall, pushes, then replies and closes the issue.

name: Guestbook

on:
  issues:
    types: [opened]

# One signature at a time, and never drop a queued one.
concurrency:
  group: guestbook
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sign:
    if: startsWith(github.event.issue.title, 'guestbook')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add signature
        id: sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/guestbook.mjs

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "chore: sign guestbook [skip ci]"
          # The daily card refresh may have pushed in the meantime; it only touches assets/.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Reply and close
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALREADY_SIGNED: ${{ steps.sign.outputs.already }}
        run: node .github/scripts/guestbook.mjs reply
