name: Ask my AI
description: Ask a question about Alfred's work. An AI answers from his profile within a minute.
title: "ask: "
body:
  - type: markdown
    attributes:
      value: |
        Ask anything about Alfred's work, stack, or availability. The answer comes from [a short profile he wrote](https://github.com/alfredsn/alfredsn/blob/main/data/about.md), so it won't guess. Up to 3 questions a day.
  - type: textarea
    id: question
    attributes:
      label: Question
      placeholder: What kind of AI work is Alfred doing?
    validations:
      required: true
