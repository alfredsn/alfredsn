<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1280" height="850" fill="url(#bg)"/>
  <text x="640" y="400" font-family="JetBrains Mono, monospace" font-size="24" fill="#a0aec0" text-anchor="middle">
    3D Contribution Graph Generating...
  </text>
  <text x="640" y="440" font-family="JetBrains Mono, monospace" font-size="16" fill="#718096" text-anchor="middle">
    Run GitHub Actions to generate this visualization
  </text>
  <rect x="540" y="470" width="200" height="6" rx="3" fill="#2d3748"/>
  <rect x="540" y="470" width="60" height="6" rx="3" fill="#a0aec0">
    <animate attributeName="width" values="60;180;60" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>