<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FF7043" stroke-width="0.4" opacity="0.15"/>
    </pattern>
    <!-- Diagonal stripe pattern (right panel) -->
    <pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3.5" height="8" fill="#FF7043" opacity="0.07"/>
    </pattern>
    <!-- Orange gradient for left bar -->
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <!-- Orange gradient for divider line -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="70%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FF7043" stop-opacity="0"/>
    </linearGradient>
    <!-- Subtle warm background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFAF8"/>
      <stop offset="100%" stop-color="#FFF3EE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="url(#bgGrad)"/>

  <!-- Grid overlay (full width) -->
  <rect width="900" height="260" fill="url(#grid)"/>

  <!-- Right decorative panel -->
  <rect x="620" y="0" width="280" height="260" fill="url(#stripe)"/>
  <rect x="720" y="0" width="180" height="260" fill="#FF7043" opacity="0.04"/>

  <!-- Decorative square top-right area -->
  <rect x="648" y="28" width="52" height="52" fill="none" stroke="#FF7043" stroke-width="1" opacity="0.25"/>
  <rect x="658" y="38" width="32" height="32" fill="#FF7043" opacity="0.07"/>

  <!-- Decorative horizontal lines right area -->
  <rect x="740" y="76" width="90" height="2.5" rx="1" fill="#FF7043" opacity="0.35"/>
  <rect x="740" y="86" width="60" height="2.5" rx="1" fill="#FF7043" opacity="0.2"/>
  <rect x="740" y="96" width="76" height="2.5" rx="1" fill="#FF7043" opacity="0.13"/>

  <!-- Decorative circle bottom-right -->
  <circle cx="822" cy="196" r="52" fill="none" stroke="#FF7043" stroke-width="1" opacity="0.18"/>
  <circle cx="822" cy="196" r="32" fill="none" stroke="#FF7043" stroke-width="0.8" opacity="0.12"/>
  <circle cx="822" cy="196" r="11" fill="#FF7043" opacity="0.1"/>

  <!-- Left orange accent bar -->
  <rect x="0" y="0" width="6" height="260" fill="url(#barGrad)"/>

  <!-- Top thin line -->
  <rect x="6" y="0" width="894" height="3" fill="#FF7043" opacity="0.1"/>

  <!-- Bottom thin line -->
  <rect x="0" y="257" width="900" height="3" fill="#FF7043" opacity="0.12"/>

  <!-- ── CONTENT ── -->

  <!-- Tag label top -->
  <rect x="20" y="20" width="6" height="16" rx="1" fill="#FF7043"/>
  <text x="32" y="32" font-family="'Courier New', Courier, monospace" font-size="10" fill="#FF7043" letter-spacing="2.5" font-weight="bold">GITHUB.COM/ALFREDSN</text>

  <!-- Main name: "Alfred" -->
  <text x="20" y="112"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="78"
        font-weight="bold"
        fill="#1A1A1A"
        letter-spacing="-3">Alfred</text>

  <!-- Main name: "SN" in orange -->
  <text x="354" y="112"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="78"
        font-weight="bold"
        fill="#FF7043"
        letter-spacing="-3">SN</text>

  <!-- Divider line under name -->
  <rect x="20" y="122" width="380" height="3" fill="url(#lineGrad)"/>
  <!-- Small dot accents -->
  <circle cx="408" cy="123.5" r="3" fill="#FF7043" opacity="0.4"/>
  <circle cx="418" cy="123.5" r="2" fill="#FF7043" opacity="0.22"/>

  <!-- Role title -->
  <text x="20" y="152"
        font-family="'Courier New', Courier, monospace"
        font-size="14"
        font-weight="bold"
        fill="#FF7043"
        letter-spacing="5">SOFTWARE ENGINEER</text>

  <!-- Sub info -->
  <text x="20" y="174"
        font-family="'Courier New', Courier, monospace"
        font-size="11"
        fill="#999999"
        letter-spacing="1">Open Source  ·  Builder  ·  Indonesia</text>

  <!-- Terminal line -->
  <rect x="20" y="192" width="390" height="32" rx="3" fill="#FF7043" opacity="0.06"/>
  <rect x="20" y="192" width="3" height="32" rx="1" fill="#FF7043" opacity="0.6"/>
  <text x="30" y="206"
        font-family="'Courier New', Courier, monospace"
        font-size="10"
        fill="#FF7043"
        opacity="0.8">$</text>
  <text x="44" y="206"
        font-family="'Courier New', Courier, monospace"
        font-size="10"
        fill="#555555">echo "Building cool things @ alfredsn.com"</text>
  <text x="44" y="220"
        font-family="'Courier New', Courier, monospace"
        font-size="10"
        fill="#999999">→  coffee.service [active] · open to collabs</text>

  <!-- Social pill tags -->
  <!-- alfredsn.com -->
  <rect x="20" y="238" width="90" height="18" rx="9" fill="none" stroke="#FF7043" stroke-width="0.8" opacity="0.5"/>
  <rect x="20" y="238" width="90" height="18" rx="9" fill="#FF7043" opacity="0.07"/>
  <text x="65" y="251"
        font-family="'Courier New', Courier, monospace"
        font-size="9"
        fill="#FF7043"
        text-anchor="middle"
        letter-spacing="0.5">alfredsn.com</text>

  <!-- LinkedIn -->
  <rect x="118" y="238" width="68" height="18" rx="9" fill="none" stroke="#FF7043" stroke-width="0.8" opacity="0.5"/>
  <rect x="118" y="238" width="68" height="18" rx="9" fill="#FF7043" opacity="0.07"/>
  <text x="152" y="251"
        font-family="'Courier New', Courier, monospace"
        font-size="9"
        fill="#FF7043"
        text-anchor="middle"
        letter-spacing="0.5">LinkedIn</text>

  <!-- GitHub -->
  <rect x="194" y="238" width="58" height="18" rx="9" fill="none" stroke="#FF7043" stroke-width="0.8" opacity="0.5"/>
  <rect x="194" y="238" width="58" height="18" rx="9" fill="#FF7043" opacity="0.07"/>
  <text x="223" y="251"
        font-family="'Courier New', Courier, monospace"
        font-size="9"
        fill="#FF7043"
        text-anchor="middle"
        letter-spacing="0.5">GitHub</text>

  <!-- Email -->
  <rect x="260" y="238" width="50" height="18" rx="9" fill="none" stroke="#FF7043" stroke-width="0.8" opacity="0.5"/>
  <rect x="260" y="238" width="50" height="18" rx="9" fill="#FF7043" opacity="0.07"/>
  <text x="285" y="251"
        font-family="'Courier New', Courier, monospace"
        font-size="9"
        fill="#FF7043"
        text-anchor="middle"
        letter-spacing="0.5">Email</text>
</svg>
