<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%">
  <defs>
    <linearGradient id="snake-dark-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#718096"/>
      <stop offset="50%" style="stop-color:#a0aec0"/>
      <stop offset="100%" style="stop-color:#718096"/>
    </linearGradient>
  </defs>
  <rect width="850" height="200" fill="#0d1117"/>
  <text x="425" y="100" font-family="JetBrains Mono, monospace" font-size="18" fill="#a0aec0" text-anchor="middle">
    Snake Animation (Dark Mode) Generating...
  </text>
  <text x="425" y="130" font-family="JetBrains Mono, monospace" font-size="14" fill="#4a5568" text-anchor="middle">
    Run GitHub Actions to generate the dark contribution snake
  </text>
  <path d="M 200 160 Q 425 140 650 160" stroke="url(#snake-dark-grad)" stroke-width="3" fill="none" stroke-dasharray="10,5">
    <animate attributeName="stroke-dashoffset" values="0;-15" dur="1s" repeatCount="indefinite"/>
  </path>
</svg>