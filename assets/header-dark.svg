<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Alfred Sahala Nainggolan. Full-stack software engineer, moving into AI engineering. 221 contributions in the past year across 80 days, longest streak 6 days, most active on Wednesdays.">
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI Variable Display','Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif; font-variant-numeric: tabular-nums; }
    .rise { animation: rise 900ms cubic-bezier(.22,1,.36,1) both; }
    .pop  { animation: pop 520ms cubic-bezier(.34,1.4,.64,1) both; transform-box: fill-box; transform-origin: center; }
    .grow { animation: grow 900ms cubic-bezier(.34,1.25,.64,1) both; transform-box: fill-box; transform-origin: 50% 100%; }
    .fill { animation: fill 1100ms cubic-bezier(.22,1,.36,1) both; transform-box: fill-box; transform-origin: 0 50%; }
    .ping { animation: ping 2.2s cubic-bezier(.22,1,.36,1) 1.6s infinite both; transform-box: fill-box; transform-origin: center; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes pop  { from { opacity: 0; transform: scale(.3); } }
    @keyframes grow { from { transform: scaleY(0); } }
    @keyframes fill { from { transform: scaleX(0); } }
    @keyframes ping { 0% { opacity: .8; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2.4); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x=".5" y=".5" width="879" height="239" rx="16" fill="#161B22" stroke="#30363D"/>
  <defs><clipPath id="av"><circle cx="64" cy="64" r="32"/></clipPath></defs>
  <g class="rise"><image href="data:image/png;base64," x="32" y="32" width="64" height="64" clip-path="url(#av)"/>
  <circle cx="64" cy="64" r="31.5" fill="none" stroke="#30363D"/></g>
  <g class="rise" style="animation-delay:60ms">
    <text x="120" y="62" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#F5F5F7">Alfred Sahala Nainggolan</text>
    <text x="120" y="88" font-size="15" fill="#A1A1A6">Full-stack software engineer, moving into AI engineering.</text>
  </g>
  <rect x="32" y="128" width="816" height="1" fill="#30363D"/>
  <g class="rise" style="animation-delay:200ms">
    <text x="32" y="188" font-size="28" font-weight="600" letter-spacing="-0.4" fill="#F5F5F7">221</text>
    <text x="32" y="212" font-size="13" fill="#A1A1A6">contributions, past year</text>
  </g>
  <g class="rise" style="animation-delay:290ms">
    <text x="236" y="188" font-size="28" font-weight="600" letter-spacing="-0.4" fill="#F5F5F7">80</text>
    <text x="236" y="212" font-size="13" fill="#A1A1A6">days with a commit</text>
  </g>
  <g class="rise" style="animation-delay:380ms">
    <text x="440" y="188" font-size="28" font-weight="600" letter-spacing="-0.4" fill="#F5F5F7">6 days</text>
    <text x="440" y="212" font-size="13" fill="#A1A1A6">longest streak</text>
  </g>
  <g class="rise" style="animation-delay:470ms">
    <text x="644" y="188" font-size="28" font-weight="600" letter-spacing="-0.4" fill="#F5F5F7">Wednesday</text>
    <text x="644" y="212" font-size="13" fill="#A1A1A6">most active weekday</text>
  </g>
</svg>
